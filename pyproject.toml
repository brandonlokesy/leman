[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "leman"
version = "0.1.0"
description = "Léman — Library for Exciton and Moiré Analysis in Nanostructures"
requires-python = ">=3.9"
authors = [{ name = "Brandon Loke" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "ffmpeg",
    "requests",
    "h5py",
    "tifffile",
]

[project.scripts]
leman-convert = "leman.converters:main"

[project.optional-dependencies]
# Extra colormap sources.  None is required: every default is a Matplotlib
# colormap.  cmcrameri and cmocean register into Matplotlib under the prefixes
# "cmc." and "cmo." once imported; seaborn supplies palettes and colormaps that
# are passed as objects.
colormaps = ["cmcrameri", "cmocean", "seaborn"]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "black",
    "cmcrameri",
]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]