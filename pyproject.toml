[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "leman"
version = "0.1.0"
description = "Léman — Library for Exciton and Moiré Analysis in Nanostructures"
requires-python = ">=3.9"
authors = [{ name = "Brandon Loke" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "ffmpeg",
    "requests",
    "h5py",
    "tifffile",
    "pillow",
    "matplotlib-scalebar",
]

[project.scripts]
leman-convert = "leman.converters:main"

[project.optional-dependencies]
# Extra colormap sources.  None is required: every default is a Matplotlib
# colormap.  cmcrameri and cmocean register into Matplotlib under the prefixes
# "cmc." and "cmo." once imported; seaborn supplies palettes and colormaps that
# are passed as objects.
colormaps = ["cmcrameri", "cmocean", "seaborn"]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "black",
    "cmcrameri",
]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files installed with the package. setuptools copies only .py files
# unless told otherwise; an editable install reads the source tree directly, so a
# missing entry here passes every local test and fails only on someone else's
# machine.
[tool.setuptools.package-data]
leman = ["data/*.npz"]